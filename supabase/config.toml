# Konfigurasi Supabase CLI untuk Task Runner.
# Dokumentasi lengkap: https://supabase.com/docs/guides/cli/config

# project_id hanya label lokal untuk membedakan stack Supabase di mesin kamu.
project_id = "task-runner"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Samakan dengan versi Postgres di project Supabase kamu (cek di Dashboard).
major_version = 15

[studio]
enabled = true
port = 54323

# Penangkap email untuk pengembangan lokal (Inbucket).
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Ganti dengan URL aplikasi kamu saat deploy.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# Di lokal: nonaktifkan konfirmasi email agar pendaftaran cepat saat testing.
# Di production, konfirmasi email diatur lewat Dashboard, bukan file ini.
enable_confirmations = false
